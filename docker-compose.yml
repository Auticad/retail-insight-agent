services:
  db:
    image: pgvector/pgvector:pg16      # PostgreSQL 16 con l'estensione pgvector (serve dalla guida F)
    container_name: retail-db
    environment:
      POSTGRES_DB: retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: ${DB_PASSWORD:-retail_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # eseguiti solo alla prima creazione del volume
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
